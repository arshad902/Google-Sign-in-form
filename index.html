<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshad</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<body>
    <div class="main-container">
        <div class="parent">
            <div class="google-part">
                <div class="img-logo">
                    <img src="./images.png">
                    <h1>Sign in</h1>
                    <p class="first-para">Use your Google account</p>
                </div>
                <div class="input-part">
                    <input type="text" placeholder="email or phone" name="user email or phone" required>
                    <p class="forgot">forgot email?</p>
                    <p class="sec-para">
                        Not your Computer? Use guest mode to sign in privetly. <br/>
                        <span>Learn more aboutusing guest mode</span>
                    </p>
                    <p class="third-para">
                    <span class="create">Create account</span>
                    <button class="First">Next</button>
                    </p>
                </div>
            </div>
            <div class="link-part">
                <select name="languages" id="dropdown">
                    <option value="English">English (United States)</option>
                </select>
                <p class="first">Help</p>
                <p class="sec">Privacy</p>
                <p class="third">Terms</p>
            </div>
        </div>
    </div>
</body>
</html>
